name: Build libtdjson (iOS)

# Builds TDLib's tdjson library for iOS using TDLib's own official scripts
# (tdlib/td/example/ios/), which handle OpenSSL + TDLib for every Apple
# platform. Produces libtdjson.xcframework with the iOS device and iOS
# simulator slices.
#
# This repo exists only to run this build on free public-repo macOS runners
# (GitHub bills macOS at 10x minutes on private repos; a build here is roughly
# 90-180 minutes of wall clock). Nothing proprietary is involved: the job
# checks out tdlib/td and builds it.
#
# Run it from the Actions tab ("Run workflow") and download the
# "libtdjson-ios" artifact when it finishes. The OpenSSL half is cached, so a
# re-run after a failure in the TDLib half skips the ~8 minutes it measured at.
#
# It produces the binary only. Wiring it into an Xcode project (adding the
# xcframework to the target, embedding, and the -Wl,-U linker flags that stop
# the linker dropping symbols Dart looks up at run time) is a separate step
# that has to happen in Xcode on a Mac.
#
# Note also that TDLib's script emits *dynamic* libraries (it runs
# install_name_tool over them), packaged as an xcframework of bare .dylib
# files rather than .framework bundles. iOS wants embedded dynamic code in a
# .framework, so expect to either wrap the dylib in one or switch to a static
# build at integration time.

on:
  workflow_dispatch:
    inputs:
      tdlib_ref:
        description: "TDLib git ref (branch, tag, or commit) to build"
        required: false
        default: "master"
      ios_deployment_target:
        description: "Minimum iOS version. Must be <= the app's IPHONEOS_DEPLOYMENT_TARGET (15.0)."
        required: false
        default: "15.0"

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 300

    steps:
      # TDLib needs a reasonably modern toolchain, and the macos-15 image can
      # default to an older Xcode. Pinned deliberately: an older default Xcode has broken TDLib
      # builds before.
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # gperf is a hard TDLib build dependency. coreutils is for `grealpath`,
      # which build.sh calls on its very first line — the GNU realpath, absent
      # from stock macOS. cmake is preinstalled on the runner image but pinning
      # it here costs nothing and survives an image change.
      - name: Install build dependencies
        run: |
          brew install gperf coreutils cmake
          echo "--- versions ---"
          cmake --version | head -1
          gperf --version | head -1
          grealpath --version | head -1

      - name: Checkout TDLib source
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ github.event.inputs.tdlib_ref }}
          path: td

      # Both scripts hardcode the full Apple platform list with no flag to
      # narrow it (the only affordance upstream is a commented-out
      # `#platforms="watchOS"` line meant for hand-editing). Building macOS,
      # watchOS, tvOS and visionOS as well would roughly quintuple a build
      # that is already the expensive part of this job, for four platforms
      # this app does not ship. "iOS" alone still yields both the device and
      # the simulator slice.
      #
      # The greps below are the point of this step as much as the seds are: a
      # silently non-matching sed would produce a correct-looking 3-hour build
      # of everything, so a changed upstream line must fail here instead.
      - name: Restrict both build scripts to iOS and pin the deployment target
        working-directory: td/example/ios
        env:
          IOS_MIN: ${{ github.event.inputs.ios_deployment_target }}
        run: |
          set -e
          ORIGINAL='platforms="macOS iOS watchOS tvOS visionOS"'
          for SCRIPT in build-openssl.sh build.sh; do
            grep -qF "$ORIGINAL" "$SCRIPT" || {
              echo "::error::Expected platform line not found in $SCRIPT."
              echo "::error::Upstream changed it; re-check the sed below against tdlib/td."
              grep -n 'platforms=' "$SCRIPT" || true
              exit 1
            }
            sed -i '' "s/^${ORIGINAL}\$/platforms=\"iOS\"/" "$SCRIPT"
            grep -qF 'platforms="iOS"' "$SCRIPT" || {
              echo "::error::sed did not apply to $SCRIPT"; exit 1; }
            echo "--- $SCRIPT ---"
            grep -n 'platforms=' "$SCRIPT"
          done

          # TDLib's CMake/iOS.cmake only emits -mios-version-min when
          # IOS_DEPLOYMENT_TARGET is set (see its line ~151), and build.sh
          # never sets it — so clang falls back to the SDK version. Under
          # Xcode 26.3 that produced a framework with MinimumOSVersion 26.2,
          # which silently will not load on any device this app targets.
          # OpenSSL is unaffected: Python-Apple-support builds it at
          # -mios-version-min=12.0 regardless.
          : "${IOS_MIN:=15.0}"
          MARKER='  options="$options -DCMAKE_BUILD_TYPE=Release"'
          grep -qF "$MARKER" build.sh || {
            echo "::error::Could not find the cmake options line in build.sh."
            echo "::error::Upstream changed set_cmake_options; re-check this injection."
            grep -n 'options=' build.sh || true
            exit 1
          }
          awk -v min="$IOS_MIN" -v marker="$MARKER" '
            { print }
            $0 == marker { print "  options=\"$options -DIOS_DEPLOYMENT_TARGET=" min "\""; found = 1 }
            END { if (!found) exit 1 }
          ' build.sh > build.sh.patched || {
            echo "::error::Failed to inject IOS_DEPLOYMENT_TARGET into build.sh"; exit 1; }
          mv build.sh.patched build.sh
          chmod +x build.sh
          echo "--- pinned deployment target ---"
          grep -n 'IOS_DEPLOYMENT_TARGET' build.sh

      # Keyed on the script itself: the OpenSSL version is pinned inside it (a
      # beeware/Python-Apple-support commit), so the script changing is exactly
      # when this output goes stale. Note the key is computed after the sed
      # step above, so it reflects the iOS-only script actually used.
      #
      # Deliberately restore/save rather than actions/cache: that action only
      # writes the cache in a post step, which is skipped when the job fails.
      # A job that got past OpenSSL and then failed in TDLib would otherwise
      # pay the OpenSSL cost again on every retry — which is exactly what the
      # first three runs of this workflow did.
      - name: Restore built OpenSSL
        id: openssl-cache
        uses: actions/cache/restore@v4
        with:
          path: td/example/ios/third_party/openssl
          key: tdlib-openssl-ios-${{ runner.os }}-${{ hashFiles('td/example/ios/build-openssl.sh') }}

      - name: Build OpenSSL for iOS
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        working-directory: td/example/ios
        run: ./build-openssl.sh

      - name: Save built OpenSSL
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: td/example/ios/third_party/openssl
          key: tdlib-openssl-ios-${{ runner.os }}-${{ hashFiles('td/example/ios/build-openssl.sh') }}

      # TDLib generates several sources at build time (td_api.cpp, the mtproto
      # and JSON scheme, mime_type_to_extension.cpp) with generator binaries
      # that must RUN, so they have to be built for the host, not the target.
      # CMakeLists.txt only defines the `prepare_cross_compiling` target under
      # `if (NOT CMAKE_CROSSCOMPILING)`, and upstream's build.sh never invokes
      # it — it gets those files as a side effect of "macOS" being first in
      # its platform list, that pass being a native build. Narrowing platforms
      # to iOS removes the only native pass, and the cross build then dies at
      # ~8% with "No rule to make target .../generate/auto/mime_type_to_
      # extension.cpp". So run the host generation explicitly.
      #
      # TD_GENERATE_SOURCE_FILES=ON makes CMakeLists return early before it
      # requires OpenSSL (line ~169), so this configures and builds only the
      # generators — a couple of minutes, not a second full TDLib build, which
      # is the point of doing it this way rather than re-adding macOS.
      - name: Generate cross-compilation sources on the host
        working-directory: td
        run: |
          set -e
          mkdir -p build-host
          cd build-host
          cmake -DCMAKE_BUILD_TYPE=Release -DTD_GENERATE_SOURCE_FILES=ON ..
          cmake --build . --target prepare_cross_compiling -j"$(sysctl -n hw.ncpu)"
          cd ..
          echo "--- generated sources ---"
          ls -la tdutils/generate/auto/ td/telegram/ 2>/dev/null | head -40
          test -f tdutils/generate/auto/mime_type_to_extension.cpp || {
            echo "::error::Host generation did not produce mime_type_to_extension.cpp"
            find . -path '*generate/auto*' -name '*.cpp' | head -20
            exit 1
          }

      - name: Build tdjson for iOS
        working-directory: td/example/ios
        run: ./build.sh

      # Upload BEFORE verifying. A 40-minute build is expensive to repeat, and
      # a failure in the checks below is exactly when you most want the binary
      # in hand to inspect.
      #
      # build.sh's final line is `rsync --recursive libtdjson.xcframework
      # ../tdjson/`, run from example/ios/build — so the output directory is
      # example/ios/tdjson, not example/tdjson. It holds the xcframework plus
      # per-platform iOS/ and iOS-simulator/ trees of headers and dylibs.
      - name: Upload libtdjson artifact
        uses: actions/upload-artifact@v4
        with:
          name: libtdjson-ios
          path: td/example/ios/tdjson/**
          if-no-files-found: error
          retention-days: 30

      # ── Make the output shippable ────────────────────────────────────────
      # TDLib's build.sh emits bare .dylib files packaged into an xcframework.
      # iOS does not support standalone dynamic libraries outside a framework
      # bundle, and App Store Connect rejects them with ITMS-90171 ("apps
      # cannot contain standalone executables or libraries"). So the raw
      # xcframework above is useful for inspection but cannot ship; wrap each
      # dylib in a real TDLib.framework and build a second xcframework of
      # those. That is also the shape the Dart FFI loader already
      # probes ('TDLib.framework/TDLib').
      #
      # MinimumOSVersion is read back out of the binary rather than guessed:
      # it must not exceed the app's deployment target, and TDLib's
      # CMake/iOS.cmake — not this workflow — decides it.
      - name: Wrap the dylibs into TDLib.xcframework
        working-directory: td/example/ios/build
        env:
          IOS_MIN: ${{ github.event.inputs.ios_deployment_target }}
        run: |
          set -e
          OUT=../tdjson-framework
          rm -rf "$OUT"
          mkdir -p "$OUT"

          for SLICE in "iOS:iPhoneOS:device" "iOS-simulator:iPhoneSimulator:simulator"; do
            INSTALL=${SLICE%%:*}
            REST=${SLICE#*:}
            SDKNAME=${REST%%:*}
            TAG=${REST#*:}

            DYLIB="install-${INSTALL}/lib/libtdjson.dylib"
            if [ ! -f "$DYLIB" ]; then
              echo "::error::Expected $DYLIB, which build.sh should have installed"
              ls -la install-* 2>/dev/null || true
              exit 1
            fi

            FW="$OUT/$TAG/TDLib.framework"
            mkdir -p "$FW/Headers"
            cp "$DYLIB" "$FW/TDLib"
            chmod +x "$FW/TDLib"
            install_name_tool -id @rpath/TDLib.framework/TDLib "$FW/TDLib"

            cp "install-${INSTALL}/include/td/telegram/td_json_client.h" "$FW/Headers/" 2>/dev/null \
              || echo "note: td_json_client.h not installed; the framework ships without headers (Dart looks symbols up by name, so this is not fatal)"

            MINOS=$(otool -l "$FW/TDLib" | awk '$1=="minos"{print $2; exit}')
            if [ -z "$MINOS" ]; then
              MINOS=$(otool -l "$FW/TDLib" | awk '/LC_VERSION_MIN_IPHONEOS/{f=1} f&&$1=="version"{print $2; exit}')
            fi
            if [ -z "$MINOS" ]; then
              echo "::error::Could not read the minimum iOS version out of $DYLIB"
              otool -l "$FW/TDLib" | head -60
              exit 1
            fi
            echo "$TAG slice: arch=$(lipo -info "$FW/TDLib" | sed 's/.*: //'), minimum iOS $MINOS"

            # The whole point of pinning IOS_DEPLOYMENT_TARGET above. A
            # framework whose minimum is higher than the app's deployment
            # target builds and ships happily, then fails to load at launch.
            : "${IOS_MIN:=15.0}"
            if [ "$MINOS" != "$IOS_MIN" ]; then
              echo "::error::$TAG slice has MinimumOSVersion $MINOS, expected $IOS_MIN"
              echo "::error::Check that the IOS_DEPLOYMENT_TARGET injection into build.sh took effect."
              exit 1
            fi

            cat > "$FW/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>TDLib</string>
            <key>CFBundleIdentifier</key><string>org.telegram.TDLib</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>TDLib</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleSupportedPlatforms</key><array><string>${SDKNAME}</string></array>
            <key>MinimumOSVersion</key><string>${MINOS}</string>
          </dict>
          </plist>
          PLIST
            plutil -lint "$FW/Info.plist"
          done

          xcodebuild -create-xcframework \
            -framework "$OUT/device/TDLib.framework" \
            -framework "$OUT/simulator/TDLib.framework" \
            -output "$OUT/TDLib.xcframework"

          echo "--- TDLib.xcframework ---"
          find "$OUT/TDLib.xcframework" -maxdepth 3

      - name: Upload TDLib.xcframework (the shippable one)
        uses: actions/upload-artifact@v4
        with:
          name: TDLib-xcframework-ios
          path: td/example/ios/tdjson-framework/TDLib.xcframework/**
          if-no-files-found: error
          retention-days: 30

      # The Dart FFI layer resolves these four symbols by name at run time
      # by name, and td_create_client_id specifically is
      # the one the client probes to decide real-vs-demo mode. A build that
      # produced a library without them would fail silently on device as
      # "demo mode" with no error, so assert it here where it is cheap to see.
      - name: Verify the xcframework and its symbols
        working-directory: td/example/ios
        run: |
          set -e
          test -d tdjson/libtdjson.xcframework || {
            echo "::error::libtdjson.xcframework was not produced"
            find . -maxdepth 3 -name '*.xcframework' -o -maxdepth 3 -name '*.dylib' | head -20
            exit 1
          }

          echo "--- tdjson output tree ---"
          find tdjson -maxdepth 3 | head -40
          echo "--- xcframework Info.plist ---"
          cat tdjson/libtdjson.xcframework/Info.plist || true

          # TDLib names the library with its version — libtdjson.1.8.67.dylib
          # — inside the xcframework, though the copy under install-*/lib that
          # the wrapping step uses is the unversioned name. Match both, and
          # the extensionless form a framework-style slice would use.
          DEVICE_LIB=$(find tdjson/libtdjson.xcframework -path '*ios-arm64/*' \( -name 'libtdjson*.dylib' -o -name 'libtdjson' \) | grep -v simulator | head -1)
          test -n "$DEVICE_LIB" || {
            echo "::error::No iOS device (arm64) slice found in the xcframework"; exit 1; }
          echo "device slice: $DEVICE_LIB"

          echo "--- architectures ---"
          lipo -info "$DEVICE_LIB"
          echo "--- load command / platform ---"
          otool -l "$DEVICE_LIB" | grep -A4 LC_BUILD_VERSION | head -20 || true

          echo "--- exported td_* symbols ---"
          nm -gU "$DEVICE_LIB" | grep ' _td_' || true
          for SYM in _td_create_client_id _td_send _td_receive _td_execute; do
            nm -gU "$DEVICE_LIB" | grep -q " $SYM$" || { echo "::error::Symbol $SYM is missing from the device slice"; exit 1; }
          done
          echo "All four td_* symbols present."

          echo "--- TDLib.framework sanity ---"
          FW_BIN=tdjson-framework/device/TDLib.framework/TDLib
          test -f "$FW_BIN" || { echo "::error::device TDLib.framework binary missing"; exit 1; }

          # A wrong install_name is the classic silent failure: the app links
          # and ships, then dyld cannot find the image at launch. It must be
          # @rpath-relative and name the framework, not the original dylib.
          INSTALL_NAME=$(otool -D "$FW_BIN" | tail -1)
          echo "install_name: $INSTALL_NAME"
          test "$INSTALL_NAME" = "@rpath/TDLib.framework/TDLib" || {
            echo "::error::install_name is '$INSTALL_NAME', expected @rpath/TDLib.framework/TDLib"; exit 1; }

          # The dylib must be self-contained apart from OS libraries: build.sh
          # links tdcore and OpenSSL in statically. Anything else listed here
          # would be a second binary we would also have to ship.
          echo "--- framework dependencies ---"
          otool -L "$FW_BIN"
          otool -L "$FW_BIN" | tail -n +2 | grep -vE '/usr/lib/|/System/Library/|@rpath/TDLib.framework/TDLib' \
            && { echo "::error::framework depends on a non-system library (see above)"; exit 1; } || true

          for SYM in _td_create_client_id _td_send _td_receive _td_execute; do
            nm -gU "$FW_BIN" | grep -q " $SYM$" \
              || { echo "::error::Symbol $SYM missing from TDLib.framework"; exit 1; }
          done
          echo "TDLib.framework verified: symbols present, install_name correct, no extra dependencies."
