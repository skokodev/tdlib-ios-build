name: Build libtdjson (iOS)

# Builds TDLib's tdjson library for iOS using TDLib's own official scripts
# (tdlib/td/example/ios/), which handle OpenSSL + TDLib for every Apple
# platform. Produces libtdjson.xcframework with the iOS device and iOS
# simulator slices.
#
# This repo exists only to run this build on free public-repo macOS runners
# (GitHub bills macOS at 10x minutes on private repos; a build here is roughly
# 90-180 minutes of wall clock). Nothing proprietary is involved: the job
# checks out tdlib/td and builds it.
#
# Run it from the Actions tab ("Run workflow") and download the
# "libtdjson-ios" artifact when it finishes. The OpenSSL half is cached, so a
# re-run after a failure in the TDLib half skips the ~8 minutes it measured at.
#
# It produces the binary only. Wiring it into an Xcode project (adding the
# xcframework to the target, embedding, and the -Wl,-U linker flags that stop
# the linker dropping symbols Dart looks up at run time) is a separate step
# that has to happen in Xcode on a Mac.
#
# Note also that TDLib's script emits *dynamic* libraries (it runs
# install_name_tool over them), packaged as an xcframework of bare .dylib
# files rather than .framework bundles. iOS wants embedded dynamic code in a
# .framework, so expect to either wrap the dylib in one or switch to a static
# build at integration time.

on:
  workflow_dispatch:
    inputs:
      tdlib_ref:
        description: "TDLib git ref (branch, tag, or commit) to build"
        required: false
        default: "master"

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 300

    steps:
      # TDLib needs a reasonably modern toolchain, and the macos-15 image can
      # default to an older Xcode. Pinned deliberately: an older default Xcode has broken TDLib
      # builds before.
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # gperf is a hard TDLib build dependency. coreutils is for `grealpath`,
      # which build.sh calls on its very first line — the GNU realpath, absent
      # from stock macOS. cmake is preinstalled on the runner image but pinning
      # it here costs nothing and survives an image change.
      - name: Install build dependencies
        run: |
          brew install gperf coreutils cmake
          echo "--- versions ---"
          cmake --version | head -1
          gperf --version | head -1
          grealpath --version | head -1

      - name: Checkout TDLib source
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ github.event.inputs.tdlib_ref }}
          path: td

      # Both scripts hardcode the full Apple platform list with no flag to
      # narrow it (the only affordance upstream is a commented-out
      # `#platforms="watchOS"` line meant for hand-editing). Building macOS,
      # watchOS, tvOS and visionOS as well would roughly quintuple a build
      # that is already the expensive part of this job, for four platforms
      # this app does not ship. "iOS" alone still yields both the device and
      # the simulator slice.
      #
      # The greps below are the point of this step as much as the seds are: a
      # silently non-matching sed would produce a correct-looking 3-hour build
      # of everything, so a changed upstream line must fail here instead.
      - name: Restrict both build scripts to iOS
        working-directory: td/example/ios
        run: |
          set -e
          ORIGINAL='platforms="macOS iOS watchOS tvOS visionOS"'
          for SCRIPT in build-openssl.sh build.sh; do
            grep -qF "$ORIGINAL" "$SCRIPT" || {
              echo "::error::Expected platform line not found in $SCRIPT."
              echo "::error::Upstream changed it; re-check the sed below against tdlib/td."
              grep -n 'platforms=' "$SCRIPT" || true
              exit 1
            }
            sed -i '' "s/^${ORIGINAL}\$/platforms=\"iOS\"/" "$SCRIPT"
            grep -qF 'platforms="iOS"' "$SCRIPT" || {
              echo "::error::sed did not apply to $SCRIPT"; exit 1; }
            echo "--- $SCRIPT ---"
            grep -n 'platforms=' "$SCRIPT"
          done

      # Keyed on the script itself: the OpenSSL version is pinned inside it (a
      # beeware/Python-Apple-support commit), so the script changing is exactly
      # when this output goes stale.
      - name: Cache built OpenSSL
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: td/example/ios/third_party/openssl
          key: tdlib-openssl-ios-${{ runner.os }}-${{ hashFiles('td/example/ios/build-openssl.sh') }}

      - name: Build OpenSSL for iOS
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        working-directory: td/example/ios
        run: ./build-openssl.sh

      # TDLib generates several sources at build time (td_api.cpp, the mtproto
      # and JSON scheme, mime_type_to_extension.cpp) with generator binaries
      # that must RUN, so they have to be built for the host, not the target.
      # CMakeLists.txt only defines the `prepare_cross_compiling` target under
      # `if (NOT CMAKE_CROSSCOMPILING)`, and upstream's build.sh never invokes
      # it — it gets those files as a side effect of "macOS" being first in
      # its platform list, that pass being a native build. Narrowing platforms
      # to iOS removes the only native pass, and the cross build then dies at
      # ~8% with "No rule to make target .../generate/auto/mime_type_to_
      # extension.cpp". So run the host generation explicitly.
      #
      # TD_GENERATE_SOURCE_FILES=ON makes CMakeLists return early before it
      # requires OpenSSL (line ~169), so this configures and builds only the
      # generators — a couple of minutes, not a second full TDLib build, which
      # is the point of doing it this way rather than re-adding macOS.
      - name: Generate cross-compilation sources on the host
        working-directory: td
        run: |
          set -e
          mkdir -p build-host
          cd build-host
          cmake -DCMAKE_BUILD_TYPE=Release -DTD_GENERATE_SOURCE_FILES=ON ..
          cmake --build . --target prepare_cross_compiling -j"$(sysctl -n hw.ncpu)"
          cd ..
          echo "--- generated sources ---"
          ls -la tdutils/generate/auto/ td/telegram/ 2>/dev/null | head -40
          test -f tdutils/generate/auto/mime_type_to_extension.cpp || {
            echo "::error::Host generation did not produce mime_type_to_extension.cpp"
            find . -path '*generate/auto*' -name '*.cpp' | head -20
            exit 1
          }

      - name: Build tdjson for iOS
        working-directory: td/example/ios
        run: ./build.sh

      # The Dart FFI layer resolves these four symbols by name at run time
      # by name, and td_create_client_id specifically is
      # the one the client probes to decide real-vs-demo mode. A build that
      # produced a library without them would fail silently on device as
      # "demo mode" with no error, so assert it here where it is cheap to see.
      - name: Verify the xcframework and its symbols
        working-directory: td/example
        run: |
          set -e
          test -d tdjson/libtdjson.xcframework || {
            echo "::error::libtdjson.xcframework was not produced"
            find . -maxdepth 3 -name '*.xcframework' -o -maxdepth 3 -name '*.dylib' | head -20
            exit 1
          }

          echo "--- xcframework layout ---"
          ls -la tdjson/libtdjson.xcframework
          cat tdjson/libtdjson.xcframework/Info.plist || true

          DEVICE_LIB=$(find tdjson/libtdjson.xcframework -path '*ios-arm64/*' \
            \( -name 'libtdjson.dylib' -o -name 'libtdjson' \) | grep -v simulator | head -1)
          test -n "$DEVICE_LIB" || {
            echo "::error::No iOS device (arm64) slice found in the xcframework"; exit 1; }
          echo "device slice: $DEVICE_LIB"

          echo "--- architectures ---"
          lipo -info "$DEVICE_LIB"

          echo "--- exported td_* symbols ---"
          nm -gU "$DEVICE_LIB" | grep ' _td_' || true
          for SYM in _td_create_client_id _td_send _td_receive _td_execute; do
            nm -gU "$DEVICE_LIB" | grep -q " $SYM\$" \
              || { echo "::error::Symbol $SYM is missing from the device slice"; exit 1; }
          done
          echo "All four td_* symbols present."

      - name: Upload libtdjson artifact
        uses: actions/upload-artifact@v4
        with:
          name: libtdjson-ios
          path: td/example/tdjson/**
          retention-days: 30
